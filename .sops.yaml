keys:
  # `admin` is the operator's age key; a host's key is its SSH host key
  # (`ssh-to-age -i <host>.pub`; `nix run .#host-key` prints it).
  - &admin age1pehwade3sd0mhf0aegvavsurmtqeffl2tnk9w8rty2u4xugf0ygq9e20pc
  - &smortress age19k8s634eqfnptm8fngc8c3yl5cyk5t4wqgaukya4j6kjtvzm2q9sq674ru
creation_rules:
  # One rule per host: `secrets/<host>.yaml` is encrypted to admin + that host.
  # Add a key above and a rule here for each new host (see AGENTS.md).
  - path_regex: secrets/smortress\.yaml$
    key_groups:
      - age:
          - *admin
          - *smortress
