keys:
  # `admin` is the operator's age key, passphrase-wrapped at ~/.config/sops/keys.age on every machine.
  # NixOS hosts also derive an identity from the SSH host key (`nix run .#host-key`); home-only Darwin
  # smoreswork has no sshd, so it uses `~/.config/sops/smoreswork.key`.
  - &admin age1skuwunreduvw8gtkzyf9atsyjnku388ly8c252h3qger84fg5d7q4kf6xs
  - &smortress age19k8s634eqfnptm8fngc8c3yl5cyk5t4wqgaukya4j6kjtvzm2q9sq674ru
  - &smorespro age1ng2qumh78k49jy468kermj7qtxgtmtusqtuwjexpnzav3qv5uufq6zugcv
  - &smoreswork age15mcd3zu8teatdq8d6kcgztd26w4dxm8gcvhpgdmkl7nmsew2tuus0l94ak
creation_rules:
  - path_regex: secrets/smortress\.yaml$
    key_groups:
      - age:
          - *admin
          - *smortress
  - path_regex: secrets/smorespro\.yaml$
    key_groups:
      - age:
          - *admin
          - *smorespro
  - path_regex: secrets/smoreswork\.yaml$
    key_groups:
      - age:
          - *admin
          - *smoreswork
  # Cross-host secrets: every listed host can read the whole shared file.
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *admin
          - *smortress
          - *smorespro
          - *smoreswork
