<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self' https://*.r2.cloudflarestorage.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'"
    />
    <title>Recovery</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section id="gate" class="gate" aria-label="Unlock">
        <form id="unlock-form" class="gate-form">
          <div class="row">
            <input
              id="recovery-password"
              type="password"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              placeholder="Recovery password"
              aria-label="Recovery password"
              required
            />
            <button type="submit" id="unlock-button">Unlock</button>
          </div>
        </form>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>

      <div id="unlocked" class="unlocked" hidden>
        <header class="page-header">
          <div id="manifest" class="manifest" aria-live="polite"></div>
        </header>

        <section id="restore" class="files-panel" aria-label="Backup files" hidden>
          <div id="browser-status" class="status" role="status" aria-live="polite"></div>

          <div class="tree-wrap">
            <ul id="browser" class="tree" aria-label="Backup files"></ul>
          </div>

          <div class="restore-bar">
            <button type="button" id="restore-all">Restore all files...</button>
            <button type="button" id="restore-cancel" class="secondary" hidden>Stop</button>
            <progress id="restore-progress" max="1" value="0" hidden></progress>
          </div>
          <div id="restore-status" class="status" role="status" aria-live="polite"></div>
        </section>

        <footer class="site-footer">
          <span>Ask Andrey for help if you need tech support</span>
          <span class="footer-sep" aria-hidden="true">·</span>
          <span>Latest backup <time id="footer-backup"></time></span>
          <span class="footer-sep" aria-hidden="true">·</span>
          <span>updated <time id="footer-updated"></time></span>
        </footer>
      </div>
    </main>
    <noscript>This page needs JavaScript to unlock the data keys.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
