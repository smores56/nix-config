# Same contract as publish-nanobot.yml: the job token holds packages: write and
# the agent holds no package credential.
name: publish-memory

on:
  push:
    branches: [main]
    paths:
      - "modules/features/ai/memory/**"
      - ".github/workflows/publish-memory.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-memory
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build, push, and print the digest
        env:
          IMAGE: ghcr.io/smores56/nix-config/memory-mcp
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::12}"
          image=$(nix build --no-link --print-out-paths .#memory-mcp-image)
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          gzip -dc "$image" >"$work/image.tar"
          export DOCKER_CONFIG=$work/docker
          printf '%s' "$GH_TOKEN" | nix run nixpkgs#crane -- auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          nix run nixpkgs#crane -- push "$work/image.tar" "$IMAGE:$tag"
          digest=$(nix run nixpkgs#crane -- digest "$IMAGE:$tag")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest"; exit 1; }
          {
            echo "### memory wrapper image"
            echo
            echo "- \`$IMAGE:$tag\`"
            echo "- \`$IMAGE@$digest\`"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "pin: $IMAGE@$digest"
          # The step summary is web-UI only. An annotation is readable through
          # the API, which is how the agent learns the digest it must pin.
          echo "::notice title=memory wrapper image::pin: $IMAGE@$digest"
