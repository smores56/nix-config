# Builds and publishes the recovery page. The Cloudflare Pages project and its DNS record
# are created by `nix run .#cloudflare-apply` (tofu/pages.tf); this workflow only uploads
# content, so it needs one Pages-scoped token and nothing else.
name: recovery

on:
  push:
    branches: [main]
    paths:
      - "recovery/**"
      - ".github/workflows/recovery.yml"
  pull_request:
    paths:
      - "recovery/**"
      - ".github/workflows/recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck
        working-directory: recovery
        run: deno task typecheck
      - name: Test
        working-directory: recovery
        run: deno task test
      - name: Build
        working-directory: recovery
        run: deno task build

      - name: Sentinel over the fixture snapshot
        working-directory: recovery
        env:
          RESTIC_PASSWORD: family-access-fixture

      - name: Headless browser smoke test
        working-directory: recovery
        env:
          CHROME: google-chrome
        run: deno task smoke

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build
        working-directory: recovery
        run: deno task build
      # wrangler-action pins wrangler 3.90 and installs it with npm inside
      # recovery/, where Deno has already created node_modules; npm fails there
      # with "Cannot read properties of null (reading isDescendantOf)". Run the
      # CLI from the repository root instead, where there is no package.json.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 385f7d47e2e8438fbda5d6f76d760434
        run: |
          # tofu owns the project; a deploy cannot create it. Fail with the fix
          # instead of the bare "project does not exist" error.
          if ! npx --yes wrangler@4.158.0 pages project list | grep -q sam-mohr-data-recovery; then
            echo "::error::Pages project sam-mohr-data-recovery is missing; run: sudo nix run .#cloudflare-apply"
            exit 1
          fi
          npx --yes wrangler@4.158.0 pages deploy recovery/dist --project-name sam-mohr-data-recovery
