[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-triage"
version = "0.1.0"
description = "Local photo triage for Immich"
requires-python = ">=3.11"
dependencies = ["pillow"]

[project.scripts]
photo-triage = "photo_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_triage"]
