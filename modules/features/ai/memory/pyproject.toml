[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "memory-mcp"
version = "0.1.0"
description = "Project-scoped cross-machine memory: Graphiti MCP wrapper, stdio shim, and CLI"
requires-python = ">=3.11"
dependencies = [ "mcp>=1.27" ]

[project.scripts]
memory-mcp = "memory_mcp.wrapper:main"
memory-mcp-shim = "memory_mcp.shim:main"
memory = "memory_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = [ "src/memory_mcp" ]
