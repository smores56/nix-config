[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "memory-mcp"
version = "0.1.0"
description = "Project-scoped cross-machine memory: Graphiti MCP wrapper, stdio shim, and CLI"
requires-python = ">=3.11"
dependencies = [ "mcp>=1.27", "httpx>=0.27", "starlette>=0.37", "anyio>=4", "uvicorn>=0.30" ]

[project.scripts]
memory-mcp = "memory_mcp.wrapper:main"
memory-mcp-shim = "memory_mcp.shim:main"
memory = "memory_mcp.cli:main"
# Graphiti-only proxy: extraction must not think; Maki keeps using 8081.
memory-llm-proxy = "memory_mcp.llm_proxy:main"

[tool.hatch.build.targets.wheel]
packages = [ "src/memory_mcp" ]
