[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "smores-sdlc"
version = "0.1.0"
description = "Stateless SDLC CLI over GitHub Issues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sdlc = "sdlc_issues:main"

[tool.setuptools]
py-modules = ["sdlc_issues"]
