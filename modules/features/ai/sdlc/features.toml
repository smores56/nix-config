[metadata]
name = "features"
description = "sdlc feature issues in the GitHub registry"
requirements = ["sdlc", "gh"]

[source]
command = "sdlc list --format path"
entry_delimiter = "\n"
display = "#{split:\t:0} {split:\t:1} [{split:\t:2}]"
output = "{split:\t:0}"

[preview]
command = "sdlc status {split:\t:0}"
